name: Fetch YouTube Statistics

on:
  # 毎時17分に実行
  # 毎時0分はGitHub全体で最も混雑しスキップされやすいため、キリの悪い分を指定している
  # （scheduleはベストエフォートのため、それでも遅延・スキップは起こり得る）
  schedule:
    - cron: '17 * * * *'

  # 手動実行も可能
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # AWS OIDC認証に必要

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    environment: Env  # GitHub Environmentsで設定したSecretsを使用

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check secrets configuration
        run: |
          if [ -z "${{ secrets.YOUTUBE_API_KEY }}" ]; then
            echo "❌ YOUTUBE_API_KEY is not set in GitHub Secrets"
            exit 1
          else
            echo "✅ YOUTUBE_API_KEY is configured"
          fi
          if [ -z "${{ secrets.YOUTUBE_CHANNEL_ID }}" ]; then
            echo "❌ YOUTUBE_CHANNEL_ID is not set in GitHub Secrets"
            exit 1
          else
            echo "✅ YOUTUBE_CHANNEL_ID is configured"
          fi

      - name: Configure AWS credentials
        if: ${{ vars.S3_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Fetch YouTube statistics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX || 'youtube_stats' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
        run: |
          python youtube_stats_extractor.py

      - name: Commit and push data (S3未設定時のみ従来のCSV push)
        if: ${{ vars.S3_BUCKET == '' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/

          # 変更があれば、コミット＆プッシュ
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 YouTube統計データを更新 ($(date +'%Y-%m-%d %H:%M:%S'))"
            git push
          fi
