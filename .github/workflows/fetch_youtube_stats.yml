name: Fetch YouTube Statistics

on:
  # 定期実行の方式は2つあり、用途に応じて選べます。
  #
  # A. 簡易構成（GitHubだけで完結）
  #    下の schedule のコメントを外すと、GitHub Actionsが定期実行します。
  #    AWSの設定なしで動かせるのが利点ですが、GitHubのscheduleは公式に
  #    ベストエフォートで実行保証がなく、遅延・スキップが頻繁に起こります
  #    （このリポジトリでの実測では成功率が92%から14%まで低下しました）。
  #
  # B. リッチ構成（S3 + Lambda）※現在はこちらを使用
  #    AWS Lambda + EventBridge Schedulerが毎時確実に実行します。
  #    設定手順は SETUP_LAMBDA.md を参照してください。
  #
  # ※ AとBを同時に有効にすると、同じ時間帯にS3へ二重に書き込まれます。
  #    どちらか一方だけを有効にしてください。
  #
  # schedule:
  #   - cron: '17 * * * *'

  # 手動実行（どちらの構成でも利用できます）
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # AWS OIDC認証に必要

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    environment: Env  # GitHub Environmentsで設定したSecretsを使用

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check secrets configuration
        run: |
          if [ -z "${{ secrets.YOUTUBE_API_KEY }}" ]; then
            echo "❌ YOUTUBE_API_KEY is not set in GitHub Secrets"
            exit 1
          else
            echo "✅ YOUTUBE_API_KEY is configured"
          fi
          if [ -z "${{ secrets.YOUTUBE_CHANNEL_ID }}" ]; then
            echo "❌ YOUTUBE_CHANNEL_ID is not set in GitHub Secrets"
            exit 1
          else
            echo "✅ YOUTUBE_CHANNEL_ID is configured"
          fi

      - name: Configure AWS credentials
        if: ${{ vars.S3_BUCKET != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}

      - name: Fetch YouTube statistics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_PREFIX: ${{ vars.S3_PREFIX || 'youtube_stats' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
        run: |
          python youtube_stats_extractor.py

      - name: Commit and push data (S3未設定時のみ従来のCSV push)
        if: ${{ vars.S3_BUCKET == '' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/

          # 変更があれば、コミット＆プッシュ
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 YouTube統計データを更新 ($(date +'%Y-%m-%d %H:%M:%S'))"
            git push
          fi
